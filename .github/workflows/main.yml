
name: CI - Teste da aplicação

'on':
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verificar arquivos
        run: |
          pwd
          ls -la
          find . -maxdepth 4 -type f
